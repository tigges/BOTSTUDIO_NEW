name: Build & Push Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag (default: sha-<short>)"
        required: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/botstudio-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/botstudio-web
  # The host pulls these until its compose file names the images above
  # (docs/deploy-synology.md, "Switching to the BotStudio names"). Delete
  # both lines, and the legacy tags below, once that is done.
  LEGACY_API_IMAGE: ghcr.io/${{ github.repository_owner }}/yai/ybot-api
  LEGACY_WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/yai/ybot-web

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set image tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  # API and web build side by side; each keeps its own layer cache scope.
  build:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Image name and build args
        id: meta
        env:
          VERSION: 1.1.${{ github.run_number }}
          BUILD: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          if [ "${{ matrix.app }}" = "api" ]; then
            echo "image=${API_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "legacy=${LEGACY_API_IMAGE}" >> "$GITHUB_OUTPUT"
            {
              echo "args<<EOF"
              echo "APP_VERSION=${VERSION}"
              echo "APP_BUILD_NUMBER=${BUILD}"
              echo "APP_GIT_SHA=${SHA}"
              echo "APP_BUILD_DATE=${DATE}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          else
            echo "image=${WEB_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "legacy=${LEGACY_WEB_IMAGE}" >> "$GITHUB_OUTPUT"
            {
              echo "args<<EOF"
              echo "VITE_API_URL=/api/v1"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            # The time of the last commit that can change the web image. A push
            # that leaves these paths alone then produces the same image ID, so
            # Watchtower leaves the web container running.
            EPOCH="$(git log -1 --format=%ct -- apps/web apps/runtime packages package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json turbo.json)"
            echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # rewrite-timestamp clamps file times to SOURCE_DATE_EPOCH, so even a
          # build without cache gives the same web image for the same inputs.
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ needs.tag.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.legacy }}:${{ needs.tag.outputs.tag }}
            ${{ steps.meta.outputs.legacy }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=botstudio-${{ matrix.app }}
          build-args: ${{ steps.meta.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Asks Watchtower on the NAS to pull :latest now. Without the
  # WATCHTOWER_HTTP_API_TOKEN secret this is skipped and Watchtower's
  # 5-minute poll deploys instead; a failed call falls back the same way.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Watchtower
        env:
          TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
          DEPLOY_URL: ${{ vars.WATCHTOWER_DEPLOY_URL || 'https://app.botstudio.uk/deploy/watchtower' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::WATCHTOWER_HTTP_API_TOKEN is not set. Watchtower deploys on its next 5-minute poll."
            exit 0
          fi
          status="$(curl -sS -o /tmp/watchtower.out -w '%{http_code}' -m 300 \
            -H "Authorization: Bearer ${TOKEN}" "$DEPLOY_URL" || true)"
          if [ "$status" = "200" ]; then
            echo "Watchtower pulled the new images."
          else
            echo "::warning::Watchtower trigger returned HTTP ${status:-none}. It deploys on its next 5-minute poll."
            cat /tmp/watchtower.out 2>/dev/null || true
          fi

  # Watchtower on the NAS polls GHCR and deploys :latest. Requires the
  # SLACK_DEPLOY_WEBHOOK secret (Slack incoming-webhook URL or any POST
  # endpoint); a no-op when the secret is absent.
  notify:
    needs: [tag, build]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Notify images published
        continue-on-error: true
        env:
          HOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          IMAGE_TAG: ${{ needs.tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$HOOK_URL" ] && exit 0
          SHORT_SHA="${GITHUB_SHA::7}"
          curl -s -o /dev/null -X POST "$HOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"📦 *BotStudio images pushed to GHCR* — tag \`${IMAGE_TAG}\` · build #${{ github.run_number }} · \`${SHORT_SHA}\`\n• API: \`${API_IMAGE}:${IMAGE_TAG}\`\n• Web: \`${WEB_IMAGE}:${IMAGE_TAG}\`\n• <${RUN_URL}|View CI run> — Watchtower deploys to AVIORI\"}"
