name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. Cancelling a Pages deploy mid-flight is what leaves
# the next attempt with a 500 from the Pages API.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm exec turbo run build --filter=@botstudio/web --ui=stream
        env:
          VITE_DEMO_MODE: "true"
          VITE_API_URL: "/api/v1"
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
          VITE_APP_VERSION: ${{ github.ref_name == 'main' && '1.1.0' || github.ref_name }}
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_BUILD_DATE: ${{ github.event.head_commit.timestamp }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url || steps.retry_again.outputs.page_url }}
    steps:
      # Creating the deployment sometimes returns 500 even though Pages is up.
      # The build artifact is already uploaded, so try again instead of leaving
      # the previous site in place.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying Pages
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Retry GitHub Pages deployment
        id: retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying Pages again
        if: steps.deployment.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: sleep 40

      - name: Retry GitHub Pages deployment again
        id: retry_again
        if: steps.deployment.outcome == 'failure' && steps.retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
