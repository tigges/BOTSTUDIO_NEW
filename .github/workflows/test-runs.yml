name: Test runs

# Visitors through the public chat, a person through the Inbox, releases through
# the release API, against the live site. Run chats are marked as test traffic
# and removed after 14 days. The scorecard is in each job's summary.

on:
  schedule:
    - cron: "20 */4 * * *"
    - cron: "40 6 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: Which bot
        type: choice
        options: [all, harbour-dental, bella, acme]
        default: harbour-dental
      kind:
        description: traffic plays visitors and the Inbox; release publishes, rolls back and forward
        type: choice
        options: [traffic, release]
        default: traffic
      generated:
        description: Generated visitors on top of the fixed ones (blank for the default)
        required: false
      only:
        description: Only these fixed scenarios, comma-separated ids (blank for all)
        required: false
      seed:
        description: Seed for visitor picks (blank for the current hour)
        required: false
      max_cost_usd:
        description: Fail the run when its model calls cost more than this many dollars
        required: false
        default: "0.25"

permissions:
  contents: read
  issues: write

concurrency:
  group: test-runs-${{ github.event.schedule || github.event.inputs.kind || 'traffic' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          TARGET: ${{ github.event.inputs.target }}
          KIND: ${{ github.event.inputs.kind }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "40 6 * * 1" ]; then
            echo 'targets=["harbour-dental"]' >> "$GITHUB_OUTPUT"
            echo 'kind=release' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ] || [ "$TARGET" = "all" ]; then
            echo 'targets=["harbour-dental","bella","acme"]' >> "$GITHUB_OUTPUT"
            echo "kind=${KIND:-traffic}" >> "$GITHUB_OUTPUT"
          else
            echo "targets=[\"$TARGET\"]" >> "$GITHUB_OUTPUT"
            echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: plan
    name: ${{ matrix.target }} (${{ needs.plan.outputs.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Play the run
        id: run
        working-directory: apps/api
        env:
          LIVE_URL: https://app.botstudio.uk
          TARGET: ${{ matrix.target }}
          KIND: ${{ needs.plan.outputs.kind }}
          GENERATED: ${{ github.event.inputs.generated }}
          ONLY: ${{ github.event.inputs.only }}
          SEED: ${{ github.event.inputs.seed }}
          QA_EMAIL: qa@acme.com
          QA_PASSWORD: ${{ secrets.QA_ACCOUNT_PASSWORD }}
          BELLA_EMAIL: demo@bella.com
          BELLA_PASSWORD: ${{ secrets.BELLA_DEMO_PASSWORD }}
          MAX_COST_USD: ${{ github.event.inputs.max_cost_usd }}
          REPORT_FILE: ${{ runner.temp }}/test-run.json
          SCORECARD_FILE: ${{ runner.temp }}/scorecard.md
        run: pnpm exec tsx src/scripts/test-run.ts

      # One open issue per bot and kind: opened on the first failure, commented
      # on while it keeps failing, closed by the next passing run.
      - name: Raise or update the failure issue
        if: failure() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Test run failing: ${{ matrix.target }} (${{ needs.plan.outputs.kind }})"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCORECARD: ${{ runner.temp }}/scorecard.md
          SLACK_WEBHOOK: ${{ secrets.TEST_RUNS_SLACK_WEBHOOK }}
        run: |
          set -euo pipefail
          {
            echo "The scheduled test run failed: $RUN_URL"
            echo
            if [ -s "$SCORECARD" ]; then cat "$SCORECARD"; else echo "The run stopped before it could score anything. Open the job log for the error."; fi
          } > /tmp/issue.md
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue.md
          fi
          if [ -n "$SLACK_WEBHOOK" ]; then
            payload="$(node -e 'process.stdout.write(JSON.stringify({ text: `${process.env.TITLE}\n${process.env.RUN_URL}` }))')"
            curl -sS -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK" --max-time 15 || echo "Slack webhook did not answer"
          fi

      - name: Close the failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Test run failing: ${{ matrix.target }} (${{ needs.plan.outputs.kind }})"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Passing again: $RUN_URL"
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run-${{ matrix.target }}-${{ needs.plan.outputs.kind }}
          path: ${{ runner.temp }}/test-run.json
          if-no-files-found: ignore
          retention-days: 14
