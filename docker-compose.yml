version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# YBot — Full stack Docker Compose
# Usage:
#   Development:  docker compose up
#   Production:   docker compose --env-file .env.production up -d
# ─────────────────────────────────────────────────────────────────────────────

x-restart: &restart unless-stopped
x-logging: &logging
  driver: "json-file"
  options: { max-size: "10m", max-file: "3" }

services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ybot-postgres
    restart: *restart
    logging: *logging
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ybot}
      POSTGRES_USER:     ${POSTGRES_USER:-ybot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ybotSecret123}
    volumes:
      - ${PGDATA_PATH:-./data/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ybot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ybot-net]

  valkey:
    image: valkey/valkey:7-alpine
    container_name: ybot-valkey
    restart: *restart
    logging: *logging
    command: valkey-server --appendonly yes --requirepass ${REDIS_PASSWORD:-valkey123}
    volumes:
      - ${VALKEY_PATH:-./data/valkey}:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD:-valkey123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ybot-net]

  minio:
    image: quay.io/minio/minio:latest
    container_name: ybot-minio
    restart: *restart
    logging: *logging
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-ybotadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ybotSecret123}
    volumes:
      - ${MINIO_PATH:-./data/minio}:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [ybot-net]

  # ── Application ───────────────────────────────────────────────────────────

  api:
    image: ybot-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ybot-api
    restart: *restart
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }
      valkey:   { condition: service_healthy }
    environment:
      NODE_ENV:       ${NODE_ENV:-production}
      PORT:           3001
      HOST:           0.0.0.0
      DATABASE_URL:   postgresql://${POSTGRES_USER:-ybot}:${POSTGRES_PASSWORD:-ybotSecret123}@postgres:5432/${POSTGRES_DB:-ybot}
      REDIS_URL:      redis://:${REDIS_PASSWORD:-valkey123}@valkey:6379
      JWT_SECRET:     ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL:   ${FRONTEND_URL:-http://localhost}
      # LLM (provide at least one). Gemini Flash is the free default.
      GEMINI_API_KEY:    ${GEMINI_API_KEY:-}
      GEMINI_MODEL:      ${GEMINI_MODEL:-gemini-2.0-flash}
      GROQ_API_KEY:      ${GROQ_API_KEY:-}
      GROQ_MODEL:        ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENAI_API_KEY:    ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL:   ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Object storage
      S3_ENDPOINT:    ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET:      ${S3_BUCKET:-ybot-uploads}
      S3_ACCESS_KEY:  ${MINIO_ROOT_USER:-ybotadmin}
      S3_SECRET_KEY:  ${MINIO_ROOT_PASSWORD:-ybotSecret123}
      S3_REGION:      ${S3_REGION:-us-east-1}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ybot-net]

  web:
    image: ybot-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: ybot-web
    restart: *restart
    logging: *logging
    depends_on:
      api: { condition: service_healthy }
    networks: [ybot-net]

  # ── Reverse proxy ─────────────────────────────────────────────────────────

  caddy:
    image: caddy:2-alpine
    container_name: ybot-caddy
    restart: *restart
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [ybot-net]

networks:
  ybot-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
