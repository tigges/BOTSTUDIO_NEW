# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.synology.yml — Synology NAS (AVIORI) overrides
#
# Project path on NAS: /volume1/docker/ybot
#
# Usage (must be run with sudo on Synology):
#   cd /volume1/docker/ybot
#   sudo docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.synology.yml \
#     --env-file .env.production \
#     up -d
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  postgres:
    volumes:
      - ${PGDATA_PATH:-/volume1/docker/ybot/pgdata}:/var/lib/postgresql/data

  valkey:
    volumes:
      - ${VALKEY_PATH:-/volume1/docker/ybot/valkey}:/data

  minio:
    volumes:
      - ${MINIO_PATH:-/volume1/docker/ybot/minio}:/data

  api:
    image: ghcr.io/tigges/botstudio-api:${IMAGE_TAG:-latest}
    # Ollama may run natively on NAS or another LAN machine
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Set to a Slack incoming-webhook URL (or any HTTP endpoint) to receive
      # a "BotStudio API is live at vX.Y.Z" notification on every container start.
      DEPLOY_WEBHOOK_URL: ${DEPLOY_WEBHOOK_URL:-}
    # Label lets Watchtower target this container by scope
    labels:
      - "com.centurylinklabs.watchtower.scope=botstudio"

  web:
    image: ghcr.io/tigges/botstudio-web:${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.scope=botstudio"

  caddy:
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_PATH:-/volume1/docker/ybot/caddy/data}:/data
      - ${CADDY_CONFIG_PATH:-/volume1/docker/ybot/caddy/config}:/config
    ports:
      # Synology DSM occupies port 80/443; shift to 8080/8443
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    extra_hosts:
      # Allow Caddy to reach Ollama running natively on the NAS host
      - "host.docker.internal:host-gateway"

  # ── Watchtower — automatic image updates ─────────────────────────────────
  # Watches botstudio-api and botstudio-web (via scope label), checks GHCR for updated
  # :latest images every 5 minutes, pulls them, and restarts the containers.
  # Sends a notification to DEPLOY_WEBHOOK_URL when it updates.
  #
  # WHY PLAINTEXT CREDENTIALS:
  #   Synology DSM stores docker-login credentials via a credential helper
  #   binary (e.g. dsm_store, pass). That binary does not exist inside the
  #   Watchtower container, so Watchtower silently fails to authenticate every
  #   poll cycle. The fix is a standalone config.json with base64-encoded
  #   credentials that Watchtower can read without any helper.
  #
  # ONE-TIME NAS SETUP — run once via SSH (replace YOUR_GITHUB_PAT):
  #
  #   GITHUB_USER=tigges
  #   GITHUB_PAT=YOUR_GITHUB_PAT        # needs read:packages scope
  #
  #   sudo mkdir -p /volume1/docker/ybot/watchtower
  #   printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
  #     "$(printf '%s:%s' "$GITHUB_USER" "$GITHUB_PAT" | base64 -w0)" \
  #     | sudo tee /volume1/docker/ybot/watchtower/config.json
  #
  #   sudo docker compose \
  #     -f docker-compose.yml -f docker-compose.synology.yml \
  #     --env-file .env.production up -d watchtower
  #
  # After that, every push to main auto-deploys within 5 minutes.
  #
  watchtower:
    image: containrrr/watchtower:latest
    container_name: botstudio-watchtower
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Standalone plaintext credentials file — see setup instructions above.
      # Synology credential helpers are not available inside the container;
      # this file provides ghcr.io auth without requiring any helper binary.
      - /volume1/docker/ybot/watchtower/config.json:/root/.docker/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"        # check every 5 minutes
      WATCHTOWER_CLEANUP: "true"             # remove old images after update
      # Replace one container at a time, so the console and the API are never
      # both down. Caddy holds requests while a container restarts.
      WATCHTOWER_ROLLING_RESTART: "true"
      # WATCHTOWER_SCOPE alone is enough to target labelled containers.
      # WATCHTOWER_LABEL_ENABLE would additionally require each container to
      # carry com.centurylinklabs.watchtower.enable=true — causing Scanned=0.
      WATCHTOWER_SCOPE: "botstudio"          # only watch containers with scope=botstudio label
      WATCHTOWER_NOTIFICATION_URL: ${DEPLOY_WEBHOOK_URL:-}
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      # Deploy as soon as CI pushes, instead of on the next 5-minute poll.
      # Off until both are set in .env.production: Watchtower exits at start
      # when the update API is on and the token is empty. Polling continues
      # either way, so a missed call only delays the deploy.
      WATCHTOWER_HTTP_API_UPDATE: ${WATCHTOWER_HTTP_API_UPDATE:-false}
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      TZ: ${TZ:-UTC}
    networks: [botstudio-net]
